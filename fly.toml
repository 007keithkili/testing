app = "manage.py"
primary_region = "nairobi"

[build]
  builder = "paketobuildpacks/builder:base"

[env]
  FLASK_CONFIG = "production"
  PORT = "5000"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

[processes]
  app = "gunicorn --bind 0.0.0.0:$PORT --workers 3 --timeout 120 manage:app"

  [processes.release]
    command = "flask --app manage.py db upgrade"
